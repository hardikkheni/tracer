packages:
  - apps/*
  - packages/*

minimumReleaseAgeExclude:
  - lucide-react@1.72.0
  - vite@8.3.8

engineStrict: true
saveExact: true

allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
  # Install hooks explicitly with pnpm hooks:install, not during dependency install.
  lefthook: false
